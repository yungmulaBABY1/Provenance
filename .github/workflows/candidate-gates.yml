name: Candidate citation-network gates (non-canonical)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  candidate-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # FAIL-CN-007 candidate. Tuned regressions and controls only; not live validation.
      # Also rebuilds the candidate prompt from the canonical v1 file and compares bytes.
      - run: python tests/test-citation-network-v2-gates.py
      # Each checker rule disabled alone must make the suite fail.
      - run: python tests/ablate-citation-network-v2-gates.py
