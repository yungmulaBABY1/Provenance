<title>Provenance — Audit Examination</title>

<style>
/* ============================================================
   TOKENS — complete light palette on bare :root
   ============================================================ */
:root {
  --ground:        #E8EAEC;
  --surface:       #F6F7F8;
  --surface-2:     #FDFDFE;
  --surface-sunk:  #DFE2E6;
  --ink:           #1A1F26;
  --ink-2:         #3D4753;
  --ink-muted:     #5C6672;
  --ink-faint:     #8A939E;
  --line:          #D3D8DD;
  --line-soft:     #E2E6EA;
  --accent:        #2F4E6F;
  --accent-soft:   #DCE4EC;
  --accent-ink:    #FFFFFF;

  --sev-fatal:     #8A3A2E;
  --sev-fatal-bg:  #F3E2DE;
  --sev-major:     #9A4436;
  --sev-major-bg:  #F5E5E1;
  --sev-minor:     #8A6320;
  --sev-minor-bg:  #F3EADA;
  --sev-sound:     #3C6A4E;
  --sev-sound-bg:  #E0EBE3;
  --sev-prov:      #5F6873;
  --sev-prov-bg:   #E5E8EB;

  --shadow-card:   0 1px 2px rgba(20,28,38,.05), 0 4px 14px -6px rgba(20,28,38,.10);
  --shadow-lift:   0 2px 4px rgba(20,28,38,.07), 0 10px 28px -10px rgba(20,28,38,.18);
  --shadow-panel:  -18px 0 48px -22px rgba(20,28,38,.35);

  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --r-sm: 5px;
  --r-md: 9px;
  --r-lg: 14px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:        #13171C;
    --surface:       #1A1F26;
    --surface-2:     #212832;
    --surface-sunk:  #0F1317;
    --ink:           #E3E7EC;
    --ink-2:         #C2C9D2;
    --ink-muted:     #97A1AD;
    --ink-faint:     #6D7783;
    --line:          #2C343E;
    --line-soft:     #232A33;
    --accent:        #86AACE;
    --accent-soft:   #23303F;
    --accent-ink:    #0F1418;

    --sev-fatal:     #D98A78;
    --sev-fatal-bg:  #33211C;
    --sev-major:     #D18C7C;
    --sev-major-bg:  #2E2019;
    --sev-minor:     #C9A462;
    --sev-minor-bg:  #2B2517;
    --sev-sound:     #7FB392;
    --sev-sound-bg:  #1B2A21;
    --sev-prov:      #9AA3AE;
    --sev-prov-bg:   #232830;

    --shadow-card:   0 1px 2px rgba(0,0,0,.30), 0 6px 18px -8px rgba(0,0,0,.50);
    --shadow-lift:   0 2px 6px rgba(0,0,0,.36), 0 14px 34px -12px rgba(0,0,0,.62);
    --shadow-panel:  -18px 0 52px -20px rgba(0,0,0,.72);
  }
}

:root[data-theme="dark"] {
  --ground:        #13171C;
  --surface:       #1A1F26;
  --surface-2:     #212832;
  --surface-sunk:  #0F1317;
  --ink:           #E3E7EC;
  --ink-2:         #C2C9D2;
  --ink-muted:     #97A1AD;
  --ink-faint:     #6D7783;
  --line:          #2C343E;
  --line-soft:     #232A33;
  --accent:        #86AACE;
  --accent-soft:   #23303F;
  --accent-ink:    #0F1418;

  --sev-fatal:     #D98A78;
  --sev-fatal-bg:  #33211C;
  --sev-major:     #D18C7C;
  --sev-major-bg:  #2E2019;
  --sev-minor:     #C9A462;
  --sev-minor-bg:  #2B2517;
  --sev-sound:     #7FB392;
  --sev-sound-bg:  #1B2A21;
  --sev-prov:      #9AA3AE;
  --sev-prov-bg:   #232830;

  --shadow-card:   0 1px 2px rgba(0,0,0,.30), 0 6px 18px -8px rgba(0,0,0,.50);
  --shadow-lift:   0 2px 6px rgba(0,0,0,.36), 0 14px 34px -12px rgba(0,0,0,.62);
  --shadow-panel:  -18px 0 52px -20px rgba(0,0,0,.72);
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}

::selection { background: var(--accent-soft); color: var(--ink); }

.eyebrow {
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============================================================
   SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100%;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 20px;
  height: 54px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: baseline; gap: 11px; min-width: 0; }

.brand-mark {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.brand-rule {
  width: 1px;
  height: 15px;
  background: var(--line);
  align-self: center;
}

.brand-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13.5px;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-spacer { flex: 1 1 auto; }

.tbtn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}
.tbtn:hover { border-color: var(--ink-faint); color: var(--ink); }
.tbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }

.workspace {
  display: grid;
  grid-template-columns: 298px minmax(0, 1fr) 452px;
  min-height: 0;
}

.region { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

.region-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 18px 11px;
  border-bottom: 1px solid var(--line-soft);
  flex: 0 0 auto;
}

.region-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
}

.scroller { overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; scrollbar-width: thin; }
.scroller::-webkit-scrollbar { width: 9px; height: 9px; }
.scroller::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; border: 2px solid transparent; background-clip: content-box; }
.scroller::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); background-clip: content-box; }

/* ============================================================
   LEFT — LIBRARY
   ============================================================ */
.library {
  background: var(--surface);
  border-right: 1px solid var(--line);
}

.lib-list { display: flex; flex-direction: column; gap: 8px; padding: 12px; }

.lib-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 13px 11px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  background: var(--surface-2);
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.lib-item:hover { border-color: var(--ink-faint); box-shadow: var(--shadow-card); }
.lib-item[aria-current="true"] {
  border-color: var(--accent);
  box-shadow: var(--shadow-card);
  background: var(--surface-2);
}
.lib-item[aria-current="true"] .lib-title { color: var(--accent); }

.lib-row { display: flex; align-items: flex-start; gap: 9px; }

.lib-title {
  font-family: var(--serif);
  font-size: 15.5px;
  line-height: 1.28;
  font-weight: 600;
  letter-spacing: -.005em;
  margin: 0 0 5px;
  text-wrap: balance;
}

.lib-claim {
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink-muted);
  margin: 0 0 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.lib-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

.lib-date {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-faint);
}

/* a verdict must never be truncated to fit; it wraps instead */
.lib-meta .vbadge {
  white-space: normal;
  height: auto;
  min-height: 19px;
  padding: 2px 7px 3px;
  line-height: 1.32;
  align-items: flex-start;
  max-width: 100%;
}
.lib-meta .vbadge .vletter { padding-top: 1px; }

/* ---- chips & badges ---- */
.chip {
  display: inline-flex;
  align-items: center;
  height: 19px;
  padding: 0 7px;
  border-radius: 3px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .045em;
  text-transform: uppercase;
  white-space: nowrap;
}
.chip-tag { background: var(--surface-sunk); color: var(--ink-muted); }
.chip-synth { background: var(--sev-prov-bg); color: var(--sev-prov); }

.vbadge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 19px;
  padding: 0 7px 0 5px;
  border-radius: 3px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .045em;
  text-transform: uppercase;
  white-space: nowrap;
}
.vbadge .vletter {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0;
}
.v-fatal { background: var(--sev-fatal-bg); color: var(--sev-fatal); }
.v-major { background: var(--sev-major-bg); color: var(--sev-major); }
.v-minor { background: var(--sev-minor-bg); color: var(--sev-minor); }
.v-sound { background: var(--sev-sound-bg); color: var(--sev-sound); }
.v-prov  { background: var(--sev-prov-bg);  color: var(--sev-prov); }

/* ============================================================
   CENTER — EXAMINATION
   ============================================================ */
.centre {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  background: var(--ground);
}

.specimen { padding: 30px 44px 40px; }
.specimen-inner { max-width: 660px; margin: 0 auto; }

.spec-provenance {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 12px;
  margin: 0 0 22px;
  border: 1px dashed var(--line);
  border-radius: var(--r-sm);
  background: var(--surface);
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-muted);
}
.spec-provenance strong { color: var(--ink-2); font-weight: 600; }

.spec-head { margin-bottom: 26px; }

.spec-kicker { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; flex-wrap: wrap; }

.spec-title {
  font-family: var(--serif);
  font-size: 31px;
  line-height: 1.16;
  font-weight: 600;
  letter-spacing: -.017em;
  margin: 0 0 8px;
  text-wrap: balance;
}

.spec-cite {
  font-family: var(--serif);
  font-size: 14px;
  font-style: italic;
  line-height: 1.5;
  color: var(--ink-muted);
  margin: 0;
}

.block { margin-bottom: 26px; }
.block > .eyebrow { display: block; margin-bottom: 10px; }

.claim-card {
  padding: 18px 20px 19px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  box-shadow: var(--shadow-card);
}
.claim-text {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.44;
  letter-spacing: -.008em;
  margin: 0;
  color: var(--ink);
}
.claim-note {
  margin: 12px 0 0;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink-muted);
}

/* verdict */
.verdict-card {
  display: flex;
  align-items: stretch;
  gap: 18px;
  padding: 17px 20px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  box-shadow: var(--shadow-card);
}
.verdict-letter {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 58px;
  border-radius: var(--r-md);
  font-family: var(--mono);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.verdict-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.verdict-label {
  font-family: var(--serif);
  font-size: 17.5px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -.008em;
}
.verdict-note { font-size: 13px; line-height: 1.55; color: var(--ink-muted); }

/* failure modes */
.modes { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--line-soft); }
.mode {
  display: grid;
  grid-template-columns: 172px minmax(0, 1fr);
  gap: 16px;
  padding: 12px 15px;
  background: var(--surface-2);
}
.mode-name { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; }
.mode-note { font-size: 12.5px; line-height: 1.5; color: var(--ink-muted); }

/* findings */
.findings { display: flex; flex-direction: column; gap: 11px; }
.finding {
  padding: 15px 17px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  box-shadow: var(--shadow-card);
}
.finding-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; flex-wrap: wrap; }
.finding-id { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); letter-spacing: .02em; }
.finding-title {
  font-family: var(--serif);
  font-size: 16.5px;
  line-height: 1.32;
  font-weight: 600;
  letter-spacing: -.008em;
  margin: 0 0 8px;
  text-wrap: balance;
}
.finding-body { font-size: 13.5px; line-height: 1.62; color: var(--ink-2); margin: 0; }
.finding-foot {
  display: flex;
  gap: 8px;
  align-items: baseline;
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
  font-size: 11.5px;
  color: var(--ink-muted);
  flex-wrap: wrap;
}
.finding-foot .k { font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.vstate { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }

.nofind {
  padding: 20px 22px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  box-shadow: var(--shadow-card);
}
.nofind p { margin: 0; font-family: var(--serif); font-size: 16px; line-height: 1.55; color: var(--ink-2); }
.nofind p + p { margin-top: 10px; font-family: var(--sans); font-size: 13px; color: var(--ink-muted); }

/* ============================================================
   BOTTOM STRIP
   ============================================================ */
.strip {
  flex: 0 0 auto;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.strip-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px 0;
}
.strip-hint { font-size: 11.5px; color: var(--ink-faint); margin-left: auto; }

.strip-rail {
  display: flex;
  gap: 9px;
  padding: 10px 18px 14px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.strip-rail::-webkit-scrollbar { height: 8px; }
.strip-rail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

.run-card {
  flex: 0 0 auto;
  width: 158px;
  text-align: left;
  padding: 10px 12px 11px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  background: var(--surface-2);
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.run-card:hover { border-color: var(--ink-faint); box-shadow: var(--shadow-card); transform: translateY(-1px); }
.run-card[aria-current="true"] { border-color: var(--accent); box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.run-card[aria-current="true"] .run-name { color: var(--accent); }
.run-card.is-inert { background: var(--surface); }
.run-card.is-inert .run-name { color: var(--ink-muted); }

.run-stage {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-faint);
  letter-spacing: .04em;
  display: block;
  margin-bottom: 5px;
}
.run-name {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.32;
  margin-bottom: 8px;
  min-height: 33px;
}
.run-state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.dot-run    { background: var(--sev-sound); }
.dot-flag   { background: var(--sev-minor); }
.dot-off    { background: var(--line); border: 1px solid var(--ink-faint); }
.dot-gap    { background: transparent; border: 1px dashed var(--ink-faint); }

/* ============================================================
   RIGHT — READOUT
   ============================================================ */
.readout {
  background: var(--surface);
  border-left: 1px solid var(--line);
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
}
.back-btn:hover { text-decoration: underline; }

.ro-body { padding: 16px 18px 34px; }

.ro-section + .ro-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line-soft); }
.ro-section > .eyebrow { display: block; margin-bottom: 9px; }

.ro-prose { font-size: 13.5px; line-height: 1.62; color: var(--ink-2); margin: 0; }
.ro-prose + .ro-prose { margin-top: 10px; }

.keylist { display: flex; flex-direction: column; gap: 9px; margin: 0; padding: 0; list-style: none; }
.keylist li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 9px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink-2);
}
.keylist .kdot { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); padding-top: 2px; }

.srclist { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--line-soft); }
.srcrow { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--surface-2); }
.srcrow-top { display: flex; align-items: center; gap: 8px; }
.srcrow-label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.srcrow-state { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .03em; color: var(--ink-muted); text-align: right; }
.srcrow-note { font-size: 12px; line-height: 1.5; color: var(--ink-muted); }

.decisive {
  padding: 14px 15px;
  border: 1px solid var(--accent);
  border-radius: var(--r-md);
  background: var(--accent-soft);
}
.decisive p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.decisive p + p { margin-top: 9px; font-size: 12.5px; color: var(--ink-2); }

/* prompt output view */
.po-head { margin-bottom: 14px; }
.po-title {
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.24;
  font-weight: 600;
  letter-spacing: -.012em;
  margin: 9px 0 8px;
  text-wrap: balance;
}
.po-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-muted); }
.po-meta .k { font-weight: 600; letter-spacing: .07em; text-transform: uppercase; font-size: 10px; color: var(--ink-faint); margin-right: 5px; }

.po-note {
  margin: 12px 0 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--sev-minor);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-2);
}
.po-note.is-plain { border-left-color: var(--line); }

.po-toolbar { display: flex; align-items: center; gap: 8px; margin: 14px 0 9px; }

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 27px;
  padding: 0 10px;

  /* ==========================================================
     DOM HELPERS
     ========================================================== */

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function $(id) { return document.getElementById(id); }

  var TONE_CLASS = { fatal: "v-fatal", major: "v-major", minor: "v-minor", sound: "v-sound", prov: "v-prov" };

  function verdictBadge(v, brief) {
    var b = el("span", "vbadge " + (TONE_CLASS[v.tone] || "v-prov"));
    b.appendChild(el("span", "vletter", v.code));
    b.appendChild(el("span", null, brief && v.short ? v.short : v.label));
    return b;
  }

  var DOT = { run: "dot-run", flagged: "dot-flag", "not-run": "dot-off", human: "dot-gap", gap: "dot-gap", decision: "dot-gap" };

  /* ==========================================================
     STATE
     ========================================================== */

  var state = { auditId: AUDITS[0].id, runIndex: null };

  function currentAudit() {
    for (var i = 0; i < AUDITS.length; i++) if (AUDITS[i].id === state.auditId) return AUDITS[i];
    return AUDITS[0];
  }

  /* ==========================================================
     LEFT — LIBRARY
     ========================================================== */

  function renderLibrary() {
    var list = $("libList");
    clear(list);
    $("libCount").textContent = AUDITS.length + " runs";

    AUDITS.forEach(function (a) {
      var btn = el("button", "lib-item");
      btn.setAttribute("role", "listitem");
      btn.setAttribute("aria-current", a.id === state.auditId ? "true" : "false");

      btn.appendChild(el("h3", "lib-title", a.title));
      btn.appendChild(el("p", "lib-claim", a.claimShort));

      var meta = el("div", "lib-meta");
      meta.appendChild(el("span", "chip chip-tag", a.tag));
      if (a.provenance === "synthetic") meta.appendChild(el("span", "chip chip-synth", "Synthetic"));
      meta.appendChild(el("span", "lib-date", a.date));
      btn.appendChild(meta);

      var meta2 = el("div", "lib-meta");
      meta2.style.marginTop = "7px";
      meta2.appendChild(verdictBadge(a.verdict, true));
      btn.appendChild(meta2);

      btn.addEventListener("click", function () {
        if (state.auditId === a.id) return;
        state.auditId = a.id;
        state.runIndex = null;
        renderAll();
        $("specimenScroll").scrollTop = 0;
      });

      list.appendChild(btn);
    });
  }

      a.findings.forEach(function (f) {

        top.appendChild(sb);
        card.appendChild(top);
        card.appendChild(el("h3", "finding-title", f.title));
        card.appendChild(el("p", "finding-body", f.body));

        var foot = el("div", "finding-foot");
        foot.appendChild(el("span", "k", "Target"));
        foot.appendChild(el("span", null, f.target));
        var sep = el("span", "k", "·");
        sep.style.letterSpacing = "0";
        foot.appendChild(sep);
        foot.appendChild(el("span", "k", "State"));
        foot.appendChild(el("span", "vstate", f.vstate));

        wrap.appendChild(card);
      });

  /* ==========================================================
     BOTTOM STRIP
     ========================================================== */

  function renderStrip() {
    var a = currentAudit();
    var rail = $("stripRail");
    clear(rail);

    var ran = 0;
    a.runs.forEach(function (r) { if (r.status === "run" || r.status === "flagged") ran++; });
    $("stripHint").textContent = ran + " of " + a.runs.length + " stages produced output";

    a.runs.forEach(function (r, i) {
      var inert = !r.output;
      var card = el("button", "run-card" + (inert ? " is-inert" : ""));
      card.setAttribute("role", "tab");
      card.setAttribute("aria-current", state.runIndex === i ? "true" : "false");

      card.appendChild(el("span", "run-stage", r.stage === "—" ? "STAGE —" : "STAGE " + r.stage));
      card.appendChild(el("div", "run-name", r.name));

      var st = el("div", "run-state");
      st.appendChild(el("span", "dot " + (DOT[r.status] || "dot-off")));
      st.appendChild(el("span", null, r.statusLabel));
      card.appendChild(st);

      card.addEventListener("click", function () {
        state.runIndex = (state.runIndex === i) ? null : i;
        renderStrip();
        renderReadout();
        $("roScroll").scrollTop = 0;
      });

      rail.appendChild(card);
    });
  }

  /* ==========================================================
     RIGHT — READOUT
     ========================================================== */

  function renderReadout() {
    var a = currentAudit();
    var head = $("roHead");
    var body = $("readout");
    clear(head);
    clear(body);
    body.classList.remove("fade-in");
    void body.offsetWidth;
    body.classList.add("fade-in");

    if (state.runIndex === null) {
      head.appendChild(el("span", "eyebrow", "Detail readout"));
      head.appendChild(el("span", "region-count", "Audit level"));
      renderAuditReadout(a, body);
    } else {
      var back = el("button", "back-btn");

      back.appendChild(el("span", null, "Audit summary"));

        state.runIndex = null;
        renderStrip();
        renderReadout();
      });
      head.appendChild(back);
      head.appendChild(el("span", "region-count", "Prompt output"));
      renderRunReadout(a.runs[state.runIndex], body);

  function section(parent, label) {
    var s = el("div", "ro-section");
    s.appendChild(el("span", "eyebrow", label));
    parent.appendChild(s);
    return s;

    a.keyFindings.forEach(function (k, i) {
      var li = el("li");
      li.appendChild(el("span", "kdot", String(i + 1).padStart(2, "0")));
      li.appendChild(el("span", null, k));
      ul.appendChild(li);
    });
    s2.appendChild(ul);

    var s3 = section(body, "Source status");
    var sl = el("div", "srclist");
    a.sourceStatus.forEach(function (s) {
      var row = el("div", "srcrow");
      var top = el("div", "srcrow-top");
      top.appendChild(el("span", "srcrow-label", s.label));
      top.appendChild(el("span", "srcrow-state", s.state));
      row.appendChild(top);
      row.appendChild(el("div", "srcrow-note", s.note));
      sl.appendChild(row);

    s3.appendChild(sl);

    var s4 = section(body, "Recommended decisive test");

  function renderRunReadout(run, body) {
    var head = el("div", "po-head");
    var kick = el("div", "spec-kicker");
    kick.appendChild(el("span", "chip chip-tag", run.stage === "—" ? "Stage —" : "Stage " + run.stage));
    var stChip = el("span", "run-state");
    stChip.appendChild(el("span", "dot " + (DOT[run.status] || "dot-off")));
    stChip.appendChild(el("span", null, run.statusLabel));
    kick.appendChild(stChip);
    head.appendChild(kick);

    head.appendChild(el("h2", "po-title", run.name));

    if (run.model || run.date) {
      var meta = el("div", "po-meta");
      if (run.model) {
        var m1 = el("span");
        m1.appendChild(el("span", "k", "Model"));
        m1.appendChild(document.createTextNode(run.model));
        meta.appendChild(m1);
      }
      if (run.date) {
        var m2 = el("span");
        m2.appendChild(el("span", "k", "Run"));
        m2.appendChild(document.createTextNode(run.date));
        meta.appendChild(m2);
      }
      head.appendChild(meta);
    }

    if (run.note) {
      var n = el("div", "po-note" + (run.output ? "" : " is-plain"), run.note);
      head.appendChild(n);
    }
    body.appendChild(head);

    if (!run.output) {
      var empty = el("div", "po-empty");
      empty.appendChild(el("p", null, "No output for this stage."));
      empty.appendChild(el("p", null, "It is listed rather than hidden. A sequence that quietly drops the stages it did not run looks identical to one that ran them all."));
      body.appendChild(empty);
      return;
    }

    var tools = el("div", "po-toolbar");
    var copyBtn = el("button", "copy-btn", "Copy output");
    tools.appendChild(copyBtn);
    var bytes = el("span", "po-bytes", run.output.split("\n").length + " lines");
    tools.appendChild(bytes);
    body.appendChild(tools);

    var wrap = el("div", "po-wrap");
    var pre = el("pre", "po-pre", run.output);
    wrap.appendChild(pre);
    body.appendChild(wrap);

    copyBtn.addEventListener("click", function () {
      copyText(run.output, copyBtn);
    });
  }

  function copyText(text, btn) {
    function ok() {
      btn.textContent = "Copied";
      btn.classList.add("is-ok");
      setTimeout(function () { btn.textContent = "Copy output"; btn.classList.remove("is-ok"); }, 1600);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); ok(); }
      catch (e) { btn.textContent = "Select the text below"; setTimeout(function () { btn.textContent = "Copy output"; }, 2200); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else {
      fallback();
    }
  }

  /* ==========================================================
     DOCUMENTATION
     ========================================================== */

  var R = {
    h3: function (t) { return "<h3>" + t + "</h3>"; },
    h4: function (t) { return "<h4>" + t + "</h4>"; },
    p: function (t, cls) { return "<p" + (cls ? " class=\"" + cls + "\"" : "") + ">" + t + "</p>"; },
    callout: function (ps) { return "<div class=\"callout\">" + ps.map(function (x) { return "<p>" + x + "</p>"; }).join("") + "</div>"; },
    numlist: function (rows) {
      return "<div class=\"numlist\">" + rows.map(function (r) {
        return "<div class=\"numrow\"><div class=\"n\">" + r[0] + "</div><div class=\"t\">" + r[1] + "</div></div>";
      }).join("") + "</div>";
    },
    vocab: function (items) {
      return "<div class=\"vocab\">" + items.map(function (i) { return "<code>" + i + "</code>"; }).join("") + "</div>";
    },
    ladder: function (rows) {
      return "<div class=\"ladder\">" + rows.map(function (r) {
        return "<div class=\"ladder-row\"><div class=\"L\">" + r[0] + "</div><div class=\"D\">" + r[1] + "</div></div>";
      }).join("") + "</div>";
    }
  };

  var docTab = DOCS[0].id;

  function renderDocs() {
    var nav = $("docsNav");
    clear(nav);
    DOCS.forEach(function (d) {
      var b = el("button", "docs-tab", d.label);
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", d.id === docTab ? "true" : "false");
      b.addEventListener("click", function () { docTab = d.id; renderDocs(); $("docsBody").scrollTop = 0; });
      nav.appendChild(b);
    });

    var body = $("docsBody");
    clear(body);
    var inner = el("div", "doc-inner");
    var doc = DOCS.filter(function (d) { return d.id === docTab; })[0];
    inner.innerHTML = doc.render(R);

    var foot = el("div", "docs-foot");
    foot.textContent = "This documentation is written for and owned by this app. The companion field-map essay it descends from is separate source material and is not reproduced here.";
    inner.appendChild(foot);

    body.appendChild(inner);
    body.classList.remove("fade-in");
    void body.offsetWidth;
    body.classList.add("fade-in");
  }

  function openDocs() {
    $("docs").classList.add("is-open");
    $("docs").setAttribute("aria-hidden", "false");
    $("scrim").classList.add("is-open");
    $("docsClose").focus();
  }
  function closeDocs() {
    $("docs").classList.remove("is-open");
    $("docs").setAttribute("aria-hidden", "true");
    $("scrim").classList.remove("is-open");
    $("docsBtn").focus();
  }

  /* ==========================================================
     THEME
     ========================================================== */

  function prefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  var themeOverride = null;

  function currentIsDark() {
    return themeOverride ? themeOverride === "dark" : prefersDark();
  }
  function syncThemeBtn() {
    var dark = currentIsDark();
    $("themeLabel").textContent = dark ? "Light" : "Dark";
    $("themeBtn").setAttribute("aria-pressed", dark ? "true" : "false");
  }
  function toggleTheme() {
    themeOverride = currentIsDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", themeOverride);
    syncThemeBtn();
  }

  /* ==========================================================
     BOOT
     ========================================================== */

  function renderAll() {
    renderLibrary();
    renderSpecimen();
    renderStrip();
    renderReadout();
  }

  $("docsBtn").addEventListener("click", openDocs);
  $("docsClose").addEventListener("click", closeDocs);
  $("scrim").addEventListener("click", closeDocs);
  $("themeBtn").addEventListener("click", toggleTheme);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("docs").classList.contains("is-open")) closeDocs();
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function () { if (!themeOverride) syncThemeBtn(); });
  }

  syncThemeBtn();
  renderDocs();
  renderAll();
})();
</script>
